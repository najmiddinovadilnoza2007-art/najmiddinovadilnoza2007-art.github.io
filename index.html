<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Najmiddinova Dilnoza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600&display=swap">
<style>
:root{
  --bg:#070a14; --card:#0d1220; --line:#1a2238; --text:#e8ecf5; --muted:#8a94ad; --accent:#3ddc84;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f4f6fb;--card:#fff;--line:#dde3f0;--text:#12182b;--muted:#5b6580;--accent:#0a9a55;color-scheme:light}
}
:root[data-theme="dark"]{--bg:#070a14;--card:#0d1220;--line:#1a2238;--text:#e8ecf5;--muted:#8a94ad;--accent:#3ddc84}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:32px 18px 48px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:44px;background:var(--card);border:2px solid var(--accent);position:relative;padding:3px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar::after{content:"";position:absolute;right:4px;bottom:6px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
h1{text-align:center;font-size:26px;font-weight:700}
.handle{text-align:center;color:var(--accent);letter-spacing:.12em;margin-top:6px;font-size:14px}
.bio{text-align:center;color:var(--muted);line-height:1.7;margin:18px 0 28px;font-size:15px}
h2{font-size:12px;letter-spacing:.25em;color:var(--muted);margin:26px 0 10px;font-weight:400}
a.card{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.card:hover,a.card:active{transform:translateY(-2px);border-color:var(--accent)}
.ico{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg)}
.ico svg{width:28px;height:28px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px}
.txt span{color:var(--muted);font-size:14px}
.arrow{color:var(--muted)}
</style>
</head>

  '<h2 class="mono">' + esc(sec.title) + '</h2>' +
  sec.links.map(l =>
    '<a class="card" href="' + esc(l.url) + '" target="_top" rel="noopener">' +
    '<div class="ico">' + (ICONS[l.icon] || l.icon) + '</div>' +
    '<div class="txt"><b>' + esc(l.name) + '</b><span>' + esc(l.desc) + '</span></div>' +
    '<div class="arrow">→</div></a>'
  ).join("")
).join("");
</script>
</body>
</html>
